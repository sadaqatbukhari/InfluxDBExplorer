name: Release

# Pushing a tag such as v1.0.0 builds Tickbird for Windows, Linux and macOS and publishes a GitHub release.
# The tag must match the version in Version.props.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Version.props
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Version.props | head -n 1 | tr -d '\r')
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Version.props ($version)."; exit 1
          fi

  build:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-latest, rid: osx-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package ${{ matrix.rid }}
        run: python installer/package.py ${{ matrix.rid }}
      - name: Windows installer
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          ./installer/build-installer.ps1
          Copy-Item artifacts/installer/Tickbird-*-Setup-win-x64.exe artifacts/release/
      - uses: actions/upload-artifact@v4
        with:
          name: tickbird-${{ matrix.rid }}
          path: |
            artifacts/release/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          [ -f "$notes" ] || notes=""
          (cd dist && sha256sum * > SHA256SUMS.txt)
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "Tickbird ${GITHUB_REF_NAME#v}" \
            ${notes:+--notes-file "$notes"} \
            $([ -z "$notes" ] && echo --generate-notes)
